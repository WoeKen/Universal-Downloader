name: Build and Release Universal Downloader

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Electron Windows Package
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Portable Zip
        shell: pwsh
        run: |
          if (Test-Path 'dist/win-unpacked') {
            Compress-Archive -Path 'dist/win-unpacked/*' -DestinationPath 'dist/Universal-Downloader-v1.3.1-Windows-Portable.zip' -Force
          }

      - name: Prepare Clean Windows Assets
        shell: pwsh
        run: |
          mkdir -p dist/clean-windows
          $setupExe = Get-ChildItem -Path 'dist' -Filter '*.exe' | Where-Object { $_.Name -notlike '*blockmap*' } | Select-Object -First 1
          if ($setupExe) {
            Copy-Item $setupExe.FullName 'dist/clean-windows/Universal-Downloader-Setup-1.3.1.exe' -Force
          }
          if (Test-Path 'dist/Universal-Downloader-v1.3.1-Windows-Portable.zip') {
            Copy-Item 'dist/Universal-Downloader-v1.3.1-Windows-Portable.zip' 'dist/clean-windows/' -Force
          }
          Get-ChildItem 'dist/clean-windows'

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist/clean-windows/*

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Install Android 34 SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p dist/clean-android
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} dist/clean-android/Universal-Downloader-v1.3.1-Android.apk \;
          ls -la dist/clean-android/

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/clean-android/Universal-Downloader-v1.3.1-Android.apk

  publish-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: release-assets

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Delete Old Release If Exists For Clean Release
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const tag = context.ref.replace('refs/tags/', '');
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              if (release && release.data) {
                console.log(`Deleting existing release ${release.data.id} (${tag}) to purge redundant assets`);
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.data.id
                });
              }
            } catch (e) {
              console.log('No prior release to purge:', e.message);
            }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "🚀 Universal Downloader v1.3.1 (Windows & Android 旗舰双端发布)"
          body_path: RELEASE_NOTES.md
          files: |
            release-assets/Universal-Downloader-Setup-1.3.1.exe
            release-assets/Universal-Downloader-v1.3.1-Windows-Portable.zip
            release-assets/Universal-Downloader-v1.3.1-Android.apk
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
